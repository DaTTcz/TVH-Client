[package]
name = "tvh-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Desktop klient pro TVHeadend (Rust + egui)"
license-file = "LICENSE"
repository = "https://github.com/DaTTcz/TVH-Client"

[dependencies]
# GUI (immediate-mode). Re-exports egui, so we don't need a separate egui
# dependency - only one place pins its version. "glow" pulls in the glow/
# egui_glow OpenGL backend (also re-exported by eframe as `eframe::glow` /
# `eframe::egui_glow`) - needed so we can paint mpv's video output straight
# into the egui window via a PaintCallback.
eframe = { version = "0.36", features = ["glow"] }

# HTTP client. Default features now pull in rustls (not native-tls / OpenSSL),
# which avoids needing system TLS dev libraries on Windows.
reqwest = { version = "0.13", features = ["blocking"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Digest auth hashing (MD5 / SHA-256 / SHA-512-256, matching what TVHeadend
# can ask for).
md-5 = "0.11"
sha2 = "0.11"
base64 = "0.23"

# Embedded video playback: talks to mpv's OpenGL render API. Needs mpv
# itself (headers + import lib + DLL) available on the system at build/run
# time - see README for Windows setup, this is the riskiest new dependency
# in this round.
libmpv2 = { version = "6", features = ["render"] }

[profile.release]
opt-level = 3
lto = true
strip = true
