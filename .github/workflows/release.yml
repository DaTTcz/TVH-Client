# Vytvoří GitHub Release s TVH-Client.exe při pushnutí tagu ve tvaru
# "vX.Y.Z" (např. v0.2.0). Appka pak sama umí zkontrolovat/stáhnout
# novější release - viz src/update.rs.
#
# POZOR: krok "Stáhnout libmpv" je natvrdo na konkrétní datovaný build ze
# Sourceforge (ten samý, co je popsaný v README pro lokální build) - časem
# zastará. Až se to stane, najdi novější na
# https://sourceforge.net/projects/mpv-player-windows/files/libmpv/
# a uprav proměnnou $mpvDevUrl níž.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nainstalovat Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Nastavit MSVC prostředí (dumpbin, lib.exe)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Stáhnout libmpv (dev balíček)
        shell: pwsh
        run: |
          $mpvDevUrl = "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-x86_64-20260607-git-71ebd08.7z/download"
          Invoke-WebRequest -Uri $mpvDevUrl -OutFile mpv-dev.7z -UserAgent "Mozilla/5.0"
          7z x mpv-dev.7z -ompv-dev
          Copy-Item mpv-dev\libmpv-2.dll vendor\mpv\libmpv-2.dll -Force

      - name: Vygenerovat mpv.lib
        working-directory: vendor/mpv
        shell: powershell
        run: ./make-lib.ps1

      - name: Build (release)
        run: cargo build --release --locked

      - name: Zkopírovat libmpv-2.dll vedle .exe (pro test/artefakt)
        shell: pwsh
        run: Copy-Item vendor\mpv\libmpv-2.dll target\release\libmpv-2.dll -Force

      - name: Vytvořit GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/TVH-Client.exe
            vendor/mpv/libmpv-2.dll
          generate_release_notes: true
